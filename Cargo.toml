[workspace]
members = [
    "crates/nirvana_core",
    "crates/nirvana_url",
    "crates/nirvana_dom",
    "crates/nirvana_html",
    "crates/nirvana_css",
    "crates/nirvana_style",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aryan <aryan@nirvanabrowser.local>"]
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace]
members = [
    "crates/nirvana_core",
    "crates/nirvana_url",
    "crates/nirvana_dom",
    "crates/nirvana_html",
    "crates/nirvana_css",
    "crates/nirvana_style",
    "crates/nirvana_layout",
    "crates/nirvana_gfx",
    "crates/nirvana_android",
    "crates/nirvana_font",
    "crates/nirvana_net",
    "crates/nirvana_js",
    "crates/nirvana_adblock",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aryan <@viroaryan>"]
license = "LicenseRef-Nirvana-Proprietary"
license-file = "LICENSE"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
